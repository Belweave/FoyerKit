name: Demo screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/demo-screenshots.yml
      - Sources/**
      - Examples/**
      - Package.swift

permissions:
  contents: read

concurrency:
  group: demo-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Build the demo and capture the intro (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.example.FoyerKitDemo
      OUT: ${{ github.workspace }}/captures
      # Seconds to let each page play before it is captured, so its picture
      # and text have settled.
      SETTLE: 16
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Pick and boot a recent iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if not d["name"].startswith("iPhone"):
                      continue
                  pro = 1 if re.fullmatch(r"iPhone \d+ Pro", d["name"]) else 0
                  key = (version(runtime), pro, d["name"])
                  if best is None or key > best[0]:
                      best = (key, d["udid"], d["name"], runtime)
          print(best[1]); print(best[2], best[3], file=sys.stderr)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 --dataNetwork wifi

      - name: Build the demo app for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Examples/FoyerKitDemo/FoyerKitDemo.xcodeproj \
            -scheme FoyerKitDemo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E 'error:|warning: |BUILD (SUCCEEDED|FAILED)' || true
          test -d build/Build/Products/Debug-iphonesimulator/FoyerKitDemo.app

      - name: Install the app
        run: xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/FoyerKitDemo.app

      - name: Capture the settings screen
        run: |
          mkdir -p "$OUT"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 6
          xcrun simctl io "$UDID" screenshot "$OUT/00-settings.png"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Capture the launch and every page
        run: |
          i=1
          for page in greeting mark symbols scene graph physics icon card; do
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -FoyerDemoPage "$page"
            if [ "$page" = greeting ]; then
              # The mark on frosted glass, before the welcome begins.
              sleep 1.2
              xcrun simctl io "$UDID" screenshot "$OUT/01-launch.png"
              sleep $((SETTLE - 1))
            else
              sleep "$SETTLE"
            fi
            n=$(printf '%02d' $((i + 1)))
            xcrun simctl io "$UDID" screenshot "$OUT/$n-$page.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            sleep 1
            i=$((i + 1))
          done

      - name: Record a clip of the intro
        run: |
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$OUT/intro.mp4" &
          REC=$!
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -FoyerDemoPage all
          sleep 20
          kill -INT "$REC"
          wait "$REC" || true
          ls -la "$OUT"

      - name: Upload screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foyerkit-demo-captures
          path: captures/
          if-no-files-found: warn

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
