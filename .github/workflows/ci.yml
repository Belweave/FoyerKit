name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick check (path tests)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)/Contents/Developer"
      - run: |
          set -o pipefail
          xcodebuild test -scheme FoyerKit -destination 'platform=macOS' -configuration Release ENABLE_TESTABILITY=YES \
            -only-testing:FoyerKitTests/MarkMotionTests -only-testing:FoyerKitTests/SymbolTracerTests | tail -n 80

  package:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)/Contents/Developer"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test (Xcode, release; the continuity tests are slow in debug)
        # xcodebuild compiles the Metal shader into the resource bundle;
        # `swift test` from the command line does not.
        run: |
          set -o pipefail
          xcodebuild test -scheme FoyerKit -destination 'platform=macOS' \
            -configuration Release ENABLE_TESTABILITY=YES | tail -n 200

  ios:
    name: Build for iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the package for iOS
        run: xcodebuild build -scheme FoyerKit -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
