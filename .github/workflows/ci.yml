name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test (release; the continuity tests are slow in debug)
        run: swift test -c release -Xswiftc -enable-testing

  ios:
    name: Build for iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the package for iOS
        run: xcodebuild build -scheme FoyerKit -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
